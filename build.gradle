plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.1'
    id 'io.spring.dependency-management' version '1.1.4'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

import com.github.jengelman.gradle.plugins.shadow.transformers.PropertiesFileTransformer

group = 'com.trading'
version = '1.0.0'
description = 'AI-Assisted Crypto Trading Engine'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
    maven { url 'https://repo.spring.io/milestone' }
    maven { url 'https://repo.spring.io/snapshot' }
}

ext {
    set('springCloudVersion', "2023.0.0")
}

dependencies {
    // Spring Cloud Function & AWS Adapter
    implementation 'org.springframework.cloud:spring-cloud-function-adapter-aws'

    // Core Spring Boot - Exclude unnecessary autoconfigure
    implementation('org.springframework.boot:spring-boot-starter') {
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
    }
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Minimal SLF4J logging (required by Lambda)
    implementation 'org.slf4j:slf4j-simple:2.0.9'

    // AWS Lambda Core
    implementation 'com.amazonaws:aws-lambda-java-core:1.2.3'
    implementation 'com.amazonaws:aws-lambda-java-events:3.11.4'

    // AWS DynamoDB SDK v2 - Exclude unused modules and Apache HTTP client
    implementation('software.amazon.awssdk:dynamodb') {
        exclude group: 'software.amazon.awssdk', module: 'netty-nio-client'
        exclude group: 'software.amazon.awssdk', module: 'apache-client'
    }
    implementation('software.amazon.awssdk:dynamodb-enhanced') {
        exclude group: 'software.amazon.awssdk', module: 'netty-nio-client'
        exclude group: 'software.amazon.awssdk', module: 'apache-client'
    }
    implementation 'software.amazon.awssdk:url-connection-client'

    // CRaC (Coordinated Restore at Checkpoint) for SnapStart
    implementation 'org.crac:crac:1.4.0'

    // Spring AI - Exclude unnecessary HTTP clients
    implementation platform('org.springframework.ai:spring-ai-bom:1.0.0-M4')
    implementation('org.springframework.ai:spring-ai-anthropic') {
        exclude group: 'io.projectreactor.netty', module: 'reactor-netty'
    }

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Jackson
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    // Telegram Bot API - Exclude only Grizzly HTTP server (not needed in Lambda)
    implementation('org.telegram:telegrambots:6.9.7.1') {
        exclude group: 'org.glassfish.jersey.containers', module: 'jersey-container-grizzly2-http'
    }

    // Apache Commons Math
    implementation 'org.apache.commons:commons-math3:3.6.1'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
        mavenBom "software.amazon.awssdk:bom:2.21.1"
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

// Ensure the JAR is built properly for Lambda
jar {
    enabled = false
}

bootJar {
    enabled = false
}

shadowJar {
    // REQUIRED: Merges standard service files
    mergeServiceFiles()

    // REQUIRED: Prevents overwriting of Spring metadata
    append 'META-INF/spring.handlers'
    append 'META-INF/spring.schemas'
    append 'META-INF/spring.tooling'

    // CRITICAL FOR SPRING BOOT 3+:
    append 'META-INF/spring/org.springframework.boot.autoconfigure.AutoConfiguration.imports'

    // Exclude unnecessary files to reduce JAR size
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
    exclude 'META-INF/LICENSE*'
    exclude 'META-INF/NOTICE*'
    exclude 'META-INF/DEPENDENCIES'
    exclude 'about.html'
    exclude 'META-INF/maven/**'
    exclude 'module-info.class'

    archiveFileName = 'ai-assisted-trading-engine-1.0.0.jar'
    manifest {
        attributes 'Main-Class': 'com.trading.engine.TradingEngineApplication'
    }
}

assemble.dependsOn shadowJar
