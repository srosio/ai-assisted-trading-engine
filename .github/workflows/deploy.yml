name: Build and Deploy to AWS

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:  # Allow manual triggering

env:
  AWS_REGION: us-east-1
  STACK_NAME: ai-trading-engine
  JAVA_VERSION: '21'

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'corretto'  # Amazon Corretto matches Lambda runtime
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test

      - name: Build Shadow JAR
        run: ./gradlew shadowJar -x test

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: trading-engine-jar
          path: build/libs/ai-assisted-trading-engine-1.0.0.jar
          retention-days: 7

  deploy-to-aws:
    name: Deploy to AWS
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: trading-engine-jar
          path: build/libs/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Package CloudFormation template
        run: |
          aws cloudformation package \
            --template-file template.yaml \
            --s3-bucket ${{ secrets.AWS_DEPLOYMENT_BUCKET }} \
            --output-template-file packaged-template.yaml

      - name: Deploy to AWS Lambda
        run: |
          aws cloudformation deploy \
            --template-file packaged-template.yaml \
            --stack-name ${{ env.STACK_NAME }} \
            --capabilities CAPABILITY_IAM \
            --no-fail-on-empty-changeset

      - name: Update Lambda environment variables
        run: |
          aws lambda update-function-configuration \
            --function-name ai-trading-engine \
            --environment Variables="{
              WEBHOOK_API_KEY=${{ secrets.WEBHOOK_API_KEY }},
              CLAUDE_API_KEY=${{ secrets.CLAUDE_API_KEY }},
              BINANCE_API_KEY=${{ secrets.BINANCE_API_KEY }},
              BINANCE_API_SECRET=${{ secrets.BINANCE_API_SECRET }},
              TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }},
              TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}
            }" || echo "Environment variables update failed, continuing..."

      - name: Wait for Lambda to be ready
        run: |
          aws lambda wait function-updated \
            --function-name ai-trading-engine

      - name: Get API Gateway endpoint
        id: get-endpoint
        run: |
          ENDPOINT=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --query 'Stacks[0].Outputs[?OutputKey==`ApiEndpoint`].OutputValue' \
            --output text)
          echo "endpoint=$ENDPOINT" >> $GITHUB_OUTPUT
          echo "API Endpoint: $ENDPOINT"

      - name: Deployment summary
        run: |
          echo "### Deployment Summary :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Stack**: ${{ env.STACK_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Region**: ${{ env.AWS_REGION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **API Endpoint**: ${{ steps.get-endpoint.outputs.endpoint }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
