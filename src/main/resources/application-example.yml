# Example configuration file
# Copy this to application-local.yml and fill in your actual values

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/trading_engine
    username: postgres
    password: your_db_password

  data:
    redis:
      host: localhost
      port: 6379
      password: your_redis_password

claude:
  api-key: your_claude_api_key_here

binance:
  api-key: your_binance_api_key
  api-secret: your_binance_api_secret

telegram:
  bot-token: your_telegram_bot_token
  chat-id: your_telegram_chat_id

trading:
  account-balance: 10000
