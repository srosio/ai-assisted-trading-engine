services:
  postgres:
    image: postgres:14-alpine
    container_name: trading_engine_db
    environment:
      POSTGRES_DB: trading_engine
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - trading_network

  redis:
    image: redis:7-alpine
    container_name: trading_engine_redis
    ports:
      - "6379:6379"
    networks:
      - trading_network

  app:
    build: .
    container_name: trading_engine
    depends_on:
      - postgres
      - redis
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/trading_engine
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_DATA_REDIS_HOST: redis
      CLAUDE_API_KEY: ${CLAUDE_API_KEY}
      BINANCE_API_KEY: ${BINANCE_API_KEY}
      BINANCE_API_SECRET: ${BINANCE_API_SECRET}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      ACCOUNT_BALANCE: ${ACCOUNT_BALANCE:-10000}
    ports:
      - "8080:8080"
    networks:
      - trading_network

volumes:
  postgres_data:

networks:
  trading_network:
    driver: bridge
