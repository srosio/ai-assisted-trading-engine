AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  AI-Assisted Trading Engine
  Spring Boot 3 + Java 21 + AWS Lambda (SnapStart) + DynamoDB

Globals:
  Function:
    Timeout: 30
    MemorySize: 2048  # 2 GB memory - good balance for Java Spring Boot
    Runtime: java21
    Architectures:
      - x86_64
      # - arm64 # SnapStart supports arm64 in many regions now, check availability. Safe bet is x86_64 for now or arm64 if preferred.
    Environment:
      Variables:
        JAVA_TOOL_OPTIONS: "-XX:+TieredCompilation -XX:TieredStopAtLevel=1"
        DYNAMODB_TABLE: !Ref JournalTable
        DYNAMODB_CACHE_TABLE: !Ref AiCacheTable
        SPRING_CLOUD_FUNCTION_DEFINITION: processWebhook;getJournalEntries;getStatistics
        SPRING_CLOUD_FUNCTION_ROUTING_EXPRESSION: "headers['routeKey'] == 'POST /api/webhook/tradingview' ? 'processWebhook' : headers['routeKey'] == 'GET /api/journal/statistics' ? 'getStatistics' : headers['routeKey'] == 'GET /api/journal' ? 'getJournalEntries' : 'processWebhook'"
    # Limit concurrent executions to prevent cost runaway (commented out for initial deployment)
    # ReservedConcurrentExecutions: 20  # Max 20 simultaneous webhook executions

Resources:
  # DynamoDB Journal Table
  JournalTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: journal_entries
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: signalId
          AttributeType: S
        - AttributeName: symbol
          AttributeType: S
        - AttributeName: setupQuality
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: signalId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: by-symbol
          KeySchema:
            - AttributeName: symbol
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: by-quality
          KeySchema:
            - AttributeName: setupQuality
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # DynamoDB AI Cache Table (for cost optimization - 20-30% savings)
  AiCacheTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ai_cache
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: cacheKey
          AttributeType: S
      KeySchema:
        - AttributeName: cacheKey
          KeyType: HASH
      TimeToLiveSpecification:
        Enabled: true
        AttributeName: ttl  # DynamoDB automatically deletes expired entries

  # Lambda Function
  TradingEngineFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: build/libs/ai-assisted-trading-engine-1.0.0.jar
      Handler: com.trading.engine.StreamLambdaHandler
      SnapStart:
        ApplyOn: PublishedVersions
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref JournalTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AiCacheTable
      Events:
        ApiWebhooks:
          Type: HttpApi
          Properties:
            Path: /api/webhook/tradingview
            Method: POST
        ApiJournal:
          Type: HttpApi
          Properties:
            Path: /api/journal
            Method: GET
        ApiStats:
          Type: HttpApi
          Properties:
            Path: /api/journal/statistics
            Method: GET
    Metadata:
      # Build method for SAM (if we used SAM CLI), but for raw AWS CLI we just point to the JAR built by Gradle
      BuildMethod: makefile

  # CloudWatch Log Group with retention policy (reduce storage costs)
  TradingEngineFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${TradingEngineFunction}
      RetentionInDays: 7  # Keep logs for 7 days only (can increase to 30, 60, 90, etc.)

  # CloudWatch Alarms for monitoring free tier usage
  LambdaInvocationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: TradingEngine-InvocationLimit-Warning
      AlarmDescription: Alert when approaching 1M Lambda invocations/month
      MetricName: Invocations
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 86400  # 1 day
      EvaluationPeriods: 1
      Threshold: 33333  # Alert at 33k invocations/day (= 1M/month pace)
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref TradingEngineFunction
      TreatMissingData: notBreaching

  LambdaComputeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: TradingEngine-ComputeLimit-Warning
      AlarmDescription: Alert when approaching 400k GB-seconds compute/month
      MetricName: Duration
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 86400  # 1 day
      EvaluationPeriods: 1
      Threshold: 6666666  # Alert at 6.67M milliseconds/day (= 200k seconds/month with 2GB memory)
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref TradingEngineFunction
      TreatMissingData: notBreaching

Outputs:
  ApiEndpoint:
    Description: "API Gateway endpoint URL"
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/api/"
  FunctionArn:
    Description: "Lambda Function ARN"
    Value: !GetAtt TradingEngineFunction.Arn
