# Mock Mode - Enable when API keys are not available
# Automatically enables mock services for Binance, Claude, and Telegram
mock:
  enabled: ${MOCK_ENABLED:false}

spring:
  application:
    name: ai-assisted-trading-engine

  datasource:
    url: jdbc:postgresql://localhost:5432/trading_engine
    username: postgres
    password: ${DB_PASSWORD:root}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

  cache:
    type: redis
    redis:
      time-to-live: 10000

server:
  port: 8080
  compression:
    enabled: true

# Webhook API Security
webhook:
  api:
    key: ${WEBHOOK_API_KEY:your-secret-api-key-here}

logging:
  level:
    root: INFO
    com.trading.engine: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
#  pattern:
#    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# Claude AI Configuration
claude:
  api-key: ${CLAUDE_API_KEY:mock-key}
  api-url: https://api.anthropic.com/v1/messages
  model: claude-sonnet-4-5-20250929
  max-tokens: 1024
  temperature: 0.3
  timeout-seconds: 30

# Binance Configuration
binance:
  api-key: ${BINANCE_API_KEY:mock-key}
  api-secret: ${BINANCE_API_SECRET:mock-secret}
  base-url: https://fapi.binance.com
  cache-seconds: 10
  timeout-seconds: 10

# Telegram Configuration
telegram:
  bot-token: ${TELEGRAM_BOT_TOKEN:mock-token}
  chat-id: ${TELEGRAM_CHAT_ID:mock-chat-id}
  enabled: true
  retry-attempts: 3

# Trading Rules (NON-NEGOTIABLE)
trading:
  # Risk Management
  min-risk-percent: 0.5
  max-risk-percent: 1.0
  default-risk-percent: 1.0
  min-risk-reward-ratio: 3.0
  max-daily-loss-r: 2.0

  # Account
  account-balance: ${ACCOUNT_BALANCE:10000}

  # Session Rules
  london-session-enabled: true
  ny-session-enabled: true
  asia-session-enabled: false

  # Setup Quality
  allow-a-quality: true
  allow-b-quality: true
  allow-c-quality: false

  # Alignment
  require-htf-alignment: true

  # Volatility
  block-high-volatility: true
  max-volatility-threshold: 2.5

  # Open Interest
  min-oi-change-percent: 2.0
