plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.1'
    id 'io.spring.dependency-management' version '1.1.4'
    // id 'com.github.johnrengelman.shadow' version '8.1.1' // Optional: for building shaded jar if needed manually
}

group = 'com.trading'
version = '1.0.0'
description = 'AI-Assisted Crypto Trading Engine'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
    maven { url 'https://repo.spring.io/milestone' }
    maven { url 'https://repo.spring.io/snapshot' }
}

ext {
    set('springCloudVersion', "2023.0.0")
}

dependencies {
    // Spring Cloud Function & AWS Adapter
    implementation 'org.springframework.cloud:spring-cloud-function-adapter-aws'

    // Core Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // AWS Lambda Core
    implementation 'com.amazonaws:aws-lambda-java-core:1.2.3'
    implementation 'com.amazonaws:aws-lambda-java-events:3.11.4'
    
    // AWS DynamoDB SDK v2
    implementation 'software.amazon.awssdk:dynamodb'
    implementation 'software.amazon.awssdk:dynamodb-enhanced'
    
    // CRaC (Coordinated Restore at Checkpoint) for SnapStart
    implementation 'org.crac:crac:1.4.0'

    // Spring AI
    implementation platform('org.springframework.ai:spring-ai-bom:1.0.0-M4')
    implementation 'org.springframework.ai:spring-ai-anthropic'

    // JAXB API 
    implementation 'javax.xml.bind:jaxb-api:2.3.1'
    implementation 'org.glassfish.jaxb:jaxb-runtime:2.3.9'
    implementation 'javax.activation:activation:1.1.1'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Jackson
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    // Telegram Bot API
    implementation 'org.telegram:telegrambots:6.9.7.1'

    // Apache Commons Math
    implementation 'org.apache.commons:commons-math3:3.6.1'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
        mavenBom "software.amazon.awssdk:bom:2.21.1"
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

// Ensure the JAR is built properly for Lambda
jar {
    enabled = false
}

bootJar {
    // This creates the thin jar or uber jar. For Lambda, usually uber jar is fine.
    // Spring Boot plugin's bootJar task creates an executable jar.
}
