name: PR Validation

on:
  pull_request:
    branches:
      - develop
      - main

env:
  JAVA_VERSION: '21'

jobs:
  validate:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'corretto'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test

      - name: Build Shadow JAR
        run: ./gradlew shadowJar -x test

      - name: Verify JAR exists
        run: |
          if [ -f "build/libs/ai-assisted-trading-engine-1.0.0.jar" ]; then
            echo "✅ JAR built successfully"
            ls -lh build/libs/ai-assisted-trading-engine-1.0.0.jar
          else
            echo "❌ JAR not found"
            exit 1
          fi

      - name: PR validation summary
        run: |
          echo "### PR Validation Summary :white_check_mark:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Tests**: Passed" >> $GITHUB_STEP_SUMMARY
          echo "- **Build**: Successful" >> $GITHUB_STEP_SUMMARY
          echo "- **JAR Size**: $(du -h build/libs/ai-assisted-trading-engine-1.0.0.jar | cut -f1)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Ready to merge! :rocket:" >> $GITHUB_STEP_SUMMARY
