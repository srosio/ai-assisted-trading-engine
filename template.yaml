AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  AI-Assisted Trading Engine
  Spring Boot 3 + Java 21 + AWS Lambda (SnapStart) + DynamoDB

Globals:
  Function:
    Timeout: 30
    MemorySize: 2048
    Runtime: java21
    Architectures:
      - x86_64
      # - arm64 # SnapStart supports arm64 in many regions now, check availability. Safe bet is x86_64 for now or arm64 if preferred.
    Environment:
      Variables:
        JAVA_TOOL_OPTIONS: "-XX:+TieredCompilation -XX:TieredStopAtLevel=1"
        DYNAMODB_TABLE: !Ref JournalTable

Resources:
  # DynamoDB Table
  JournalTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: journal_entries
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: signalId
          AttributeType: S
        - AttributeName: symbol
          AttributeType: S
        - AttributeName: setupQuality
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: signalId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: by-symbol
          KeySchema:
            - AttributeName: symbol
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: by-quality
          KeySchema:
            - AttributeName: setupQuality
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # Lambda Function
  TradingEngineFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: build/libs/ai-assisted-trading-engine-1.0.0.jar
      Handler: com.trading.engine.StreamLambdaHandler::handleRequest
      SnapStart:
        ApplyOn: PublishedVersions
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref JournalTable
      Events:
        # Define API Gateway events. 
        # Spring Cloud Function routing is handled by header "spring.cloud.function.definition" or implicitly.
        # We'll map generic paths.
        ApiWebhooks:
          Type: HttpApi
          Properties:
            Path: /api/webhook/{proxy+}
            Method: POST
        ApiJournal:
          Type: HttpApi
          Properties:
            Path: /api/journal/{proxy+}
            Method: GET
        ApiStats:
          Type: HttpApi
          Properties:
            Path: /api/journal/statistics
            Method: GET
    Metadata:
      # Build method for SAM (if we used SAM CLI), but for raw AWS CLI we just point to the JAR built by Gradle
      BuildMethod: makefile

Outputs:
  ApiEndpoint:
    Description: "API Gateway endpoint URL"
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/api/"
  FunctionArn:
    Description: "Lambda Function ARN"
    Value: !GetAtt TradingEngineFunction.Arn
