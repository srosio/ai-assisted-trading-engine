spring:
  main:
    web-application-type: none
    lazy-initialization: true
    banner-mode: off
  application:
    name: ai-assisted-trading-engine

  cloud:
    function:
      definition: processWebhook;getJournalEntries;getStatistics
      routing-expression: "headers['routeKey'] == 'POST /api/webhook' ? 'processWebhook' : headers['routeKey'] == 'GET /api/journal/statistics' ? 'getStatistics' : headers['routeKey'] == 'GET /api/journal' ? 'getJournalEntries' : 'processWebhook'"

dynamodb:
  table-name: ${DYNAMODB_TABLE:journal_entries}
  cache-table-name: ${DYNAMODB_CACHE_TABLE:ai_cache}

aws:
  region: ${AWS_REGION:us-east-1}

# Webhook API Security
webhook:
  api:
    key: ${WEBHOOK_API_KEY:mock-key}

logging:
  level:
    root: INFO
    com.trading.engine: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: INFO
  pattern:
    console: "%msg%n" # CloudWatch adds timestamps automatically


# Claude AI Configuration
claude:
  api-key: ${CLAUDE_API_KEY:mock-key}
  api-url: https://api.anthropic.com/v1/messages

  # AI Models
  model: claude-sonnet-4-5-20250929  # Primary model for full analysis
  haiku-model: claude-haiku-4-20250514  # Fast model for pre-filtering (90% cheaper)

  max-tokens: 1024
  temperature: 0.3
  timeout-seconds: 30

  # AI Cost Optimizations
  enable-smart-gating: true  # Skip AI for low-confidence signals (30-40% savings)
  enable-haiku-prefilter: true  # Use Haiku for initial screening (90% cheaper)
  enable-caching: true  # Cache similar market conditions (20-30% savings)

  smart-gating-threshold: 60  # Minimum confidence score for AI analysis (0-100)

# Binance Configuration
# Note: Rate limiting is automatically enforced (1200 weight/minute)
# The system monitors X-MBX-USED-WEIGHT headers and implements back-off for 418/429 errors
binance:
  api-key: ${BINANCE_API_KEY:mock-key}
  api-secret: ${BINANCE_API_SECRET:mock-secret}
  base-url: https://fapi.binance.com
  cache-seconds: 10  # In-memory cache TTL reduces API calls
  timeout-seconds: 10

# Telegram Configuration
telegram:
  bot-token: ${TELEGRAM_BOT_TOKEN:mock-token}
  chat-id: ${TELEGRAM_CHAT_ID:mock-chat-id}
  enabled: true
  retry-attempts: 3

# Trading Rules (NON-NEGOTIABLE)
trading:
  # Risk Management
  min-risk-percent: 0.5
  max-risk-percent: 1.0
  default-risk-percent: 1.0
  min-risk-reward-ratio: 3.0
  max-daily-loss-r: 2.0

  # Session Rules
  london-session-enabled: true
  ny-session-enabled: true
  asia-session-enabled: false

  # Setup Quality
  allow-a-quality: true
  allow-b-quality: true
  allow-c-quality: false

  # Alignment
  require-htf-alignment: true

  # Volatility
  block-high-volatility: true
  max-volatility-threshold: 2.5

  # Open Interest
  min-oi-change-percent: 2.0
